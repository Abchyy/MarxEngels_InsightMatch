[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "marx-engels-insight-match"
version = "0.1.0"
description = "Evidence-first Marx and Engels text retrieval assistant"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "lancedb>=0.25,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["packages/marx_engels"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages", "apps/api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["–", "。", "，", "？"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["marx_engels"]
mypy_path = "packages"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["packages"]
markers = [
  "contract: public contract and adapter conformance tests",
  "integration: tests using temporary infrastructure",
]

[tool.coverage.run]
branch = true
source = ["packages/marx_engels"]
