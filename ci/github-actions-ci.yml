name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: uv run ruff check packages apps/api scripts tests
      - run: uv run mypy packages/marx_engels
      - run: uv run pytest
      - run: uv run python scripts/export_openapi.py --output /tmp/openapi.v1.json
      - run: diff -u contracts/openapi.v1.json /tmp/openapi.v1.json
      - run: uv run python scripts/freeze_contracts.py --check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:api
      - run: git diff --exit-code -- apps/web/src/generated/api.ts
      - run: pnpm lint
      - run: pnpm build
